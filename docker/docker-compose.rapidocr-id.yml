# rapidocr-id production service. Source is not mounted. ONNX models are
# already inside the image from the build.
services:
  rapidocr-id:
    build:
      context: ..
      dockerfile: docker/Dockerfile.rapidocr-id
      args:
        RAPIDOCR_ID_VERSION: "1.5.5"
    image: rapidocr-id:1.5.5
    ports:
      - "8000:8000"
    environment:
      RAPIDOCR_MODEL_DIR: /opt/rapidocr/models
      RAPIDOCR_ID_VERSION: "1.5.5"
      RAPIDOCR_JOB_DIR: /data/jobs
      RAPIDOCR_JOB_TTL_HOURS: "24"
      # RAPIDOCR_WORKERS defaults to half the CPU count, clamped to 2–4.
      # RAPIDOCR_MAX_SIDE defaults to 1280 (0 keeps the library cap of 2000).
      # RAPIDOCR_INTRA_THREADS defaults to cores / workers.
    volumes:
      - rapidocr-jobs:/data/jobs
    restart: unless-stopped

  # Optional document-profile sidecar. `docker compose up` does not start it.
  #   docker compose -f docker/docker-compose.rapidocr-id.yml --profile document up
  # Existing KTP / default OCR on port 8000 is unchanged. Point DMS clients at
  # port 8001, path /ocr/document (or /ocr?profile=document on this sidecar).
  rapidocr-id-document:
    profiles: ["document"]
    image: rapidocr-id:1.5.5
    ports:
      - "8001:8000"
    environment:
      RAPIDOCR_MODEL_DIR: /opt/rapidocr/models
      RAPIDOCR_ID_VERSION: "1.5.5"
      RAPIDOCR_JOB_DIR: /data/jobs-document
      RAPIDOCR_JOB_TTL_HOURS: "24"
      RAPIDOCR_DOC_PRELOAD: "1"
      RAPIDOCR_DOC_WORKERS: "2"
    volumes:
      - rapidocr-jobs-document:/data/jobs-document
    restart: unless-stopped

volumes:
  rapidocr-jobs:
  rapidocr-jobs-document:
