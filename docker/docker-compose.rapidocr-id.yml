# rapidocr-id production service. Source is not mounted. ONNX models are
# already inside the image from the build.
services:
  rapidocr-id:
    build:
      context: ..
      dockerfile: docker/Dockerfile.rapidocr-id
      args:
        RAPIDOCR_ID_VERSION: "1.5.4"
    image: rapidocr-id:1.5.4
    ports:
      - "8000:8000"
    environment:
      RAPIDOCR_MODEL_DIR: /opt/rapidocr/models
      RAPIDOCR_ID_VERSION: "1.5.4"
      RAPIDOCR_JOB_DIR: /data/jobs
      RAPIDOCR_JOB_TTL_HOURS: "24"
      # RAPIDOCR_WORKERS defaults to half the CPU count, clamped to 2–4.
      # RAPIDOCR_MAX_SIDE defaults to 1280 (0 keeps the library cap of 2000).
      # RAPIDOCR_INTRA_THREADS defaults to cores / workers.
    volumes:
      - rapidocr-jobs:/data/jobs
    restart: unless-stopped

volumes:
  rapidocr-jobs:
