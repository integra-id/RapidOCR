# Production KTP OCR service. Does not mount source and does not download
# models on the first request; they are baked into the image.
services:
  ktp:
    build:
      context: ..
      dockerfile: docker/Dockerfile.ktp
    image: rapidocr-ktp:latest
    ports:
      - "8000:8000"
    environment:
      RAPIDOCR_MODEL_DIR: /opt/rapidocr/models
    restart: unless-stopped
